# sennit のマニフェスト。どのパスを $HOME に配置するかを宣言する。
#
# link  : リポジトリのファイルへ symlink を張る(生の編集ループを保つ)
# render: theme.toml から生成する。生成物はコミットせず(.gitignore にある)、
#         apply が配置の直前に作る。作られた後は link と同じく symlink で置く
#
# ディレクトリを指定した場合はその下のファイルを個別に symlink する。
# ディレクトリごと symlink すると、そのディレクトリに他のツールが
# 書き込んだファイルまでリポジトリに現れてしまうため。

[link]
common = [".config", ".zshenv", ".npmrc"]
darwin = [".hammerspoon"]
linux = [".local"]

# リポジトリ内にあっても配置しないもの。
# テンプレートは生成元であって配置対象ではない。
ignore = ["*.tmpl"]

# theme.toml から生成するファイル。<出力パス> = <テンプレート>
#
# 配色を持つファイルだけを対象にする。残りは link のまま触らない。
# これが「symlink の生の編集感を保ったままテンプレートを足す」という
# このツールの設計上の主張そのもの。
[render]
".config/alacritty/alacritty.toml" = ".config/alacritty/alacritty.toml.tmpl"
".config/lazygit/config.yml" = ".config/lazygit/config.yml.tmpl"
".config/zsh/rc/theme.zsh" = ".config/zsh/rc/theme.zsh.tmpl"
# 秘密を含むので apply では飛ばされる。sennit apply --secrets で生成する
".npmrc" = ".npmrc.tmpl"

# ファイルのモード。トークンを含むものが 0644 で置かれても何も壊れないので、
# 宣言しておいて apply に揃えさせ、verify に検査させる。
# ただし verify が見るのは実在するファイルだけなので、--secrets をまだ
# 通していないマシンでは .npmrc は検査対象に現れない。
[modes]
".npmrc" = "600"

# 配置したあとに走らせる処理。監視対象が変わったときだけ実行される。
[hooks.bat-themes]
# .config/bat/themes/*.tmTheme を bat のキャッシュに登録する。
# これを踏まないと BAT_THEME=tokyonight_night が解決できず、delta も既定色に落ちる。
when-changed = [".config/bat/themes"]
run = "command -v bat >/dev/null && bat cache --build >/dev/null || true"

[hooks.git-hooks]
when-changed = ["lefthook.yml"]
run = "command -v lefthook >/dev/null && lefthook install >/dev/null || true"
