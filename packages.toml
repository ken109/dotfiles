# パッケージの単一ソース。sennit check がこのファイルと設定ファイルを突き合わせ、
# 設定が参照しているのに宣言されていない依存を検出する。
#
# provides に書くのは「設定ファイルから参照されうる名前」。
# コマンド名は kind = "command"、フォント名は kind = "font"、
# エディタ拡張は kind = "extension" として扱う。
# パッケージ名と一致するコマンドは provides を省略できる。

[defaults]
# 何も指定がなければ brew の formula として全 OS に入れる
manager = "brew"

# ---------------------------------------------------------------------------
# 共通
# ---------------------------------------------------------------------------
[packages]
bat        = {}
beautysh   = {}
direnv     = {}
eza        = {}
fd         = {}
fzf        = {}
gdu        = { provides = ["gdu", "gdu-go"] }   # linuxbrew では gdu-go として入る
gh         = {}
ghq        = {}
git-delta  = { provides = ["delta"] }
herdr      = {}
hunk       = {}
lazygit    = {}
lefthook   = {}
mise       = {}
neovim     = { provides = ["nvim"] }
nushell    = { provides = ["nu"] }
ripgrep    = { provides = ["rg"] }
sennit     = {}   # ken109/tap
sheldon    = {}
shellcheck = {}
shfmt      = {}
starship   = {}
zoxide     = {}

# ---------------------------------------------------------------------------
# ディストリビューションごとに名前が違うもの
#
# macOS 限定にしたいものは os = ["darwin"] を書く。この見出しの下にあることは
# 何も意味しない。
# ---------------------------------------------------------------------------
[packages.curl]
apt = "curl"
yay = "curl"
[packages.git]
apt = "git"
yay = "git"
[packages.gnupg]
# brew の formula 名は gnupg。gpg はその別名で brew list には出ない
provides = ["gpg"]
os = ["darwin"]
[packages.libyaml]
kind = "library"   # 実行ファイルを持たない
apt = "libyaml-dev"
yay = "libyaml"
[packages.tmux]
apt = "tmux"
yay = "tmux"
[packages.trash]
os = ["darwin"]
[packages.wget]
apt = "wget"
yay = "wget"
[packages.zsh]
apt = "zsh"
yay = "zsh"

# ---------------------------------------------------------------------------
# Linux のビルド/実行に必要なもの。macOS では Xcode CLT などが賄う
# ---------------------------------------------------------------------------
[packages.build-essential]
kind = "library"   # メタパッケージ。build-essential という実行ファイルは無い
os = ["linux"]
apt = "build-essential"
yay = "base-devel"

[packages.ca-certificates]
kind = "library"
os = ["linux"]
apt = "ca-certificates"
yay = "ca-certificates"

[packages.file]
os = ["linux"]
apt = "file"
yay = "file"

[packages.gettext]
os = ["linux"]
apt = "gettext"
yay = "gettext"

[packages.procps]
provides = ["ps", "free", "pgrep"]   # procps という名前のコマンドは無い
os = ["linux"]
apt = "procps"
yay = "procps-ng"

# Alacritty は macOS では cask、Linux ではディストリのパッケージ
[packages.alacritty]
manager = "brew-cask"
apt = "alacritty"
yay = "alacritty"

# ---------------------------------------------------------------------------
# フォント (cask)
# ---------------------------------------------------------------------------
[packages.font-hack-nerd-font]
manager = "brew-cask"
provides = ["Hack Nerd Font Mono"]
kind = "font"

# ---------------------------------------------------------------------------
# GUI アプリ (cask, macOS のみ)
# ---------------------------------------------------------------------------
[packages.1password]
manager = "brew-cask"
os = ["darwin"]

[packages.1password-cli]
manager = "brew-cask"
os = ["darwin"]
provides = ["op"]
# テンプレートの {{ op://... }} が使う。Linux では cask が使えず、
# 1Password の apt リポジトリ追加が要るのでここでは入れない。
# apply は秘密を既定で飛ばすので、op が無くても支障はない。
[packages.antigravity]
manager = "brew-cask"
os = ["darwin"]
[packages.hammerspoon]
manager = "brew-cask"
os = ["darwin"]
provides = ["hs"]
[packages.jetbrains-toolbox]
manager = "brew-cask"
os = ["darwin"]
[packages.nordvpn]
manager = "brew-cask"
os = ["darwin"]
[packages.docker-desktop]
manager = "brew-cask"
os = ["darwin"]
provides = ["docker", "docker-compose"]
[packages.parallels]
manager = "brew-cask"
os = ["darwin"]
[packages.postman]
manager = "brew-cask"
os = ["darwin"]
[packages.raycast]
manager = "brew-cask"
os = ["darwin"]
[packages.slack]
manager = "brew-cask"
os = ["darwin"]
[packages.thebrowsercompany-dia]
manager = "brew-cask"
os = ["darwin"]
[packages.zed]
manager = "brew-cask"
os = ["darwin"]
[packages.zoom]
manager = "brew-cask"
os = ["darwin"]

# ---------------------------------------------------------------------------
# エディタ拡張
# ---------------------------------------------------------------------------
[packages.tokyo-night]
manager = "zed-extension"
kind = "extension"

# ---------------------------------------------------------------------------
# setup では入れないが、設定が存在を前提に分岐しているもの
#
# optional = true は「知っている依存だが自動導入はしない」という宣言。
# ignore と違い、何が optional なのかがファイルに残る。
# ---------------------------------------------------------------------------
[packages.go]
manager = "mise"
# mise が管理する。env.zsh が GOPATH を設定するために存在を見ている

[packages.kubectl]
optional = true
# 現状 setup の管理外(Docker Desktop 等が置く)。aliases.zsh の k エイリアス用

[packages.translate-shell]
provides = ["trans"]
apt = "translate-shell"
yay = "translate-shell"
# aliases.zsh の ja-en / en-ja が使う

# ---------------------------------------------------------------------------
# 検査から除外する名前
# ---------------------------------------------------------------------------
[ignore]
# ブートストラップ時点で存在する、または OS が提供するもの。
# git / curl / zsh は packages にも宣言があり、Linux では apt が入れる。
# ここに並べているのは「宣言が無くても check を通す」ためではなく、
# ブートストラップ以前から在るものを検査対象にしないため。
commands = [
    "brew", "git", "curl", "wget", "zsh", "bash", "sh", "sudo", "apt-get", "yay",
    "launchctl", "uname", "whoami", "command", "printf", "echo", "test",
]
