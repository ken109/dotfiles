name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: shfmt (formatting)
        run: shfmt -i 4 -ci -d script/

      # -x で source 先も追跡する。追跡しないと SC1091 が出る。
      - name: shellcheck
        run: shellcheck -x -S warning script/setup script/deploy script/list script/install.sh script/utils.sh

      - name: zsh syntax
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          for f in .zshenv .config/zsh/.zshrc .config/zsh/rc/*.zsh; do
            zsh -n "$f"
          done

      - name: Config file syntax
        run: |
          python3 - <<'PY'
          import tomllib, json, re, io, sys, pathlib
          fail = []
          for p in pathlib.Path('.').rglob('*.toml'):
              if '.git' in p.parts: continue
              try: tomllib.load(open(p, 'rb'))
              except Exception as e: fail.append(f'{p}: {e}')
          for p in ['.config/zed/settings.json']:
              s = io.open(p, encoding='utf-8').read()
              s = re.sub(r'//.*', '', s)
              s = re.sub(r',(\s*[}\]])', r'\1', s)   # JSONC の末尾カンマを許容
              try: json.loads(s)
              except Exception as e: fail.append(f'{p}: {e}')
          if fail:
              print('\n'.join(fail)); sys.exit(1)
          print('config syntax OK')
          PY

  sennit:
    name: sennit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sennit 本体は ken109/sennit に分離済み。ここではリリース版を取って
      # このリポジトリの宣言と設定が整合しているかだけを検証する。
      - name: Install sennit from release
        run: |
          ver=$(gh release view --repo ken109/sennit --json tagName -q .tagName)
          curl -fsSL -o sennit.tar.gz \
            "https://github.com/ken109/sennit/releases/download/${ver}/sennit-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf sennit.tar.gz
          ./sennit --version
        env:
          GH_TOKEN: ${{ github.token }}

      # 設定が参照している依存が packages.toml に宣言されているかを検証する。
      # これが落ちるのは「設定だけ更新してパッケージ側が追随していない」状態。
      - name: check (drift)
        run: ./sennit check

      # テンプレートを直して生成し忘れる、という食い違いを落とす
      - name: render --check (templates vs generated)
        run: ./sennit render --check

      # symlink 配置が既存の script/deploy と同じ結果になることを確認する。
      # deploy は fd に依存している(sennit は walkdir なので依存しない)。
      - name: apply parity with script/deploy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          a=$(mktemp -d); b=$(mktemp -d)
          HOME="$a" DOTPATH="$PWD" bash script/deploy >/dev/null
          ./sennit --home "$b" apply >/dev/null
          diff <(cd "$a" && find . -type l | sort) <(cd "$b" && find . -type l | sort)
          echo "parity ok ($(find "$b" -type l | wc -l) links)"

  install-test:
    name: Install on Ubuntu
    # 実機インストールは Homebrew ごと構築するため重い。
    # main への push と手動実行、週次のみに絞る。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs script/install.sh end to end)
        run: docker build -t dotfiles-test .
