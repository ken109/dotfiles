name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 上流のずれを拾う定期実行。新しい Ubuntu イメージ、移動した formula、
  # 変わった vite.plus のインストーラは、こちらが何もしなくても壊れる。
  schedule:
    - cron: "0 20 * * 0" # 毎週月曜 05:00 JST

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: shfmt (formatting)
        run: shfmt -i 4 -ci -d script/

      # -x で source 先も追跡する。追跡しないと SC1091 が出る。
      - name: shellcheck
        run: shellcheck -x -S warning script/*

      - name: zsh syntax
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          for f in .zshenv .config/zsh/.zshrc .config/zsh/rc/*.zsh; do
            zsh -n "$f"
          done

      - name: Config file syntax
        run: |
          python3 - <<'PY'
          import tomllib, json, re, io, sys, pathlib
          fail = []
          for p in pathlib.Path('.').rglob('*.toml'):
              if '.git' in p.parts: continue
              try: tomllib.load(open(p, 'rb'))
              except Exception as e: fail.append(f'{p}: {e}')
          for p in ['.config/zed/settings.json']:
              s = io.open(p, encoding='utf-8').read()
              s = re.sub(r'//.*', '', s)
              s = re.sub(r',(\s*[}\]])', r'\1', s)   # JSONC の末尾カンマを許容
              try: json.loads(s)
              except Exception as e: fail.append(f'{p}: {e}')
          if fail:
              print('\n'.join(fail)); sys.exit(1)
          print('config syntax OK')
          PY

  sennit:
    name: sennit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sennit 本体は ken109/sennit に分離済み。ここではリリース版を取って
      # このリポジトリの宣言と設定が整合しているかだけを検証する。
      - name: Install sennit from release
        run: |
          ver=$(gh release view --repo ken109/sennit --json tagName -q .tagName)
          curl -fsSL -o sennit.tar.gz \
            "https://github.com/ken109/sennit/releases/download/${ver}/sennit-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf sennit.tar.gz
          ./sennit --version
        env:
          GH_TOKEN: ${{ github.token }}

      # 宣言した名前がこのランナーで解決するか。formula 名の間違いを捕まえる。
      # ランナーには何も入っていないので、ここでは Linux 向けの宣言のうち
      # 実際に導入されるものだけが対象になる install-test 側で見る。
      - name: check (drift)
        run: ./sennit check

      # 隔離した HOME に対して apply が期待どおり動くことを確認する。
      # script/deploy は撤去済みなので、比較ではなく自己完結の検証にする。
      # apply は配置の前に render を走らせる。生成物は追跡していないので、
      # clone 直後のこの状態から作られる。
      - name: apply into an isolated HOME
        run: |
          h=$(mktemp -d)
          n=$(./sennit --home "$h" apply | tail -1)
          echo "$n"
          # 2 回目は差分ゼロ(冪等)
          ./sennit --home "$h" apply | grep -q "already up to date"
          # テンプレートは配置されない
          test "$(find "$h" -name '*.tmpl' | wc -l)" -eq 0
          echo "links: $(find "$h" -type l | wc -l)"

  install-test:
    name: Install on Ubuntu
    # 実機インストールは Homebrew ごと構築するため重い。
    # main への push と手動実行、週次のみに絞る。PR で packages.toml を
    # 触ったときは mutation.yml の baseline が同じビルドを回す。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs script/install.sh end to end)
        run: docker build -t dotfiles-test .

      # 実際に入った状態で、宣言した名前がすべて解決するか確かめる。
      # formula 名の間違いや、インストールが黙って失敗した状態を捕まえる。
      # brew shellenv を明示的に適用する。この設定では PATH を通すのが
      # rc/env.zsh で、対話シェルでしか読まれない。非対話で起動すると
      # linuxbrew が PATH に入らず、宣言が全部 missing に見えてしまう。
      - name: Verify declarations resolve inside the image
        run: |
          docker run --rm dotfiles-test bash -c 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; cd ~/.dotfiles && sennit verify'
