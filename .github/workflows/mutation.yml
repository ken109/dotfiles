name: Mutation test

# packages.toml の宣言が本当に必要かを、推論ではなく実行で確かめる。
#
# check は設定を読んで推論し、verify はマシンの状態を見る。どちらも
# 「その宣言を外したら何が壊れるか」には答えられない。実際、font cask を
# 展開するために unzip が要ると分かったのも、font を外した回で初めて
# だった。この違いは実際に外して動かすまで分からない。
#
# 全件を回すとコンテナビルドが宣言の数だけ走るので、PR で追加・変更された
# 宣言だけを対象にする。全件は手動実行。
#
# なお、ブートストラップが先に入れてしまうもの(build-essential / curl / file /
# git / procps と Dockerfile が入れるもの)は、外してもビルドが通る。それは
# 「要らない」ではなく「この方法では測れない」なので、判定でそう言う。
on:
  pull_request:
    paths: ["packages.toml"]
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names (empty = every declaration)"
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        name: Decide which declarations to test
        # 既定のシェルには pipefail が無い。git diff が落ちても後段が 0 を
        # 返し、「対象なし」に化ける。
        shell: bash -euo pipefail {0}
        # PR の差分から拾った名前は PR の作者が書いたもの。run: に直接
        # 展開すると `[packages."x$(...)"]` のような宣言がそのまま
        # ランナーで実行される。env 経由にして値として扱う。
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "${INPUT_PACKAGES:-}" ]; then
            names="$INPUT_PACKAGES"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # 追加・変更された [packages.x] と x = { ... } を拾う
            names=$(git diff "origin/${BASE_REF}"...HEAD -- packages.toml \
              | grep '^+' \
              | sed -nE 's/^\+\[packages\.([^]]+)\].*/\1/p; s/^\+([a-z0-9_-]+)[[:space:]]*=[[:space:]]*\{.*/\1/p' \
              | sort -u | tr '\n' ' ')
          else
            names=$(python3 -c "
          import tomllib
          print(' '.join(sorted(tomllib.load(open('packages.toml','rb'))['packages'])))")
          fi
          names=$(echo "$names" | tr -s ' ' | sed 's/^ //; s/ $//')
          echo "testing: ${names:-<none>}"
          # matrix 用の JSON 配列にする
          json=$(python3 -c "
          import json, sys
          print(json.dumps(sys.argv[1].split() if sys.argv[1] else []))" "$names")
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  # 変異させない状態で 1 度だけ通す。
  #
  # これが無いと、宣言を外したビルドが落ちた理由が「その宣言が要るから」なのか
  # 「元から壊れているから」なのか区別できない。判定の土台であると同時に、
  # PR で packages.toml を壊したときに実際に落ちる唯一の関門でもある
  # (install-test は PR では走らない)。
  #
  # plan の結果に依存させない。plan が拾うのは「追加された宣言」だけなので、
  # 宣言を消した PR やセクションの中身を書き換えた PR は matrix が空になる。
  # そこで baseline まで飛ばすと、packages.toml を壊す最も普通のやり方が
  # 素通りする。トリガ(paths: packages.toml)が引けたら必ず 1 度は通す。
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install as declared
        run: docker build -t baseline .

  mutate:
    needs: [plan, baseline]
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Remove ${{ matrix.package }} from packages.toml
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 - "$PACKAGE" <<'PY'
          import re, sys, io, tomllib
          name = sys.argv[1]
          src = io.open("packages.toml", encoding="utf-8").read()
          before = tomllib.loads(src)["packages"]
          # 本文は `[` で始まらない行すべて。`#` でも止めていた頃は、本文の
          # 1 行目がコメントのセクション(gnupg)で見出しだけが消え、残りの
          # key/value が直前の表に流れ込んでいた。git が macOS 限定になった
          # 状態で「gnupg を外した結果」を測っていたことになる。
          section = re.compile(r"(?:^|\n)\[packages\.%s\]\n(?:(?!\[).*\n)*" % re.escape(name))
          inline = re.compile(r"\n%s\s*=[^\n]*\n" % re.escape(name))
          out = section.sub("\n", src, count=1)
          if out == src:
              out = inline.sub("\n", src, count=1)
          if out == src:
              sys.exit(f"{name}: no declaration found")
          # 1 件だけ消えて、他は 1 文字も変わっていないことを確かめる。
          # 名前の集合だけ見ていた頃は、別の宣言に key が流れ込む壊れ方を
          # 素通りさせていた。正規表現は信用しない。
          after = tomllib.loads(out)["packages"]
          removed = set(before) - set(after)
          if removed != {name}:
              sys.exit(f"{name}: the mutation removed {sorted(removed)}; expected only {name}")
          for other in after:
              if after[other] != before[other]:
                  sys.exit(
                      f"{name}: the mutation also changed [packages.{other}]: "
                      f"{before[other]} -> {after[other]}"
                  )
          io.open("packages.toml", "w", encoding="utf-8").write(out)
          PY
          git --no-pager diff --stat packages.toml

      # 宣言を外した状態で丸ごとインストールする。ここが落ちれば、
      # その宣言は本当に必要だったということ。
      - name: Install without it
        id: install
        continue-on-error: true
        run: docker build -t mutant .

      - name: Judge
        env:
          PACKAGE: ${{ matrix.package }}
          OUTCOME: ${{ steps.install.outcome }}
        run: |
          # この変異が Linux のビルドで測れるかどうか。
          #
          # - Dockerfile と apt bootstrap が入れるもの、およびそれらが依存で
          #   引き込むもの(ca-certificates は curl の依存として先に入る)
          # - os = ["darwin"] の宣言。sync が Linux では飛ばすので、外しても
          #   このビルドは何も変わらない
          #
          # どちらも「外しても壊れない」であって「要らない」ではない。
          # 読むのは変異前の packages.toml。作業ツリーのものは直前の
          # ステップが当の宣言を消した後なので、os を引いても必ず空になり、
          # darwin 限定の枝が一度も通らない。
          git show HEAD:packages.toml > /tmp/packages-before.toml
          if python3 - "$PACKAGE" <<'PY'
          import sys, tomllib
          name = sys.argv[1]
          bootstrap = {"build-essential", "ca-certificates", "curl", "file", "git", "procps"}
          pkg = tomllib.load(open("/tmp/packages-before.toml", "rb"))["packages"].get(name, {})
          sys.exit(0 if name in bootstrap or pkg.get("os") == ["darwin"] else 1)
          PY
          then
            unmeasurable=yes
          else
            unmeasurable=no
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "::notice::$PACKAGE is required — the install breaks without it"
          elif [ "$unmeasurable" = "yes" ]; then
            echo "::notice::$PACKAGE — inconclusive; this Linux build never installs it, so removing the declaration cannot break it"
          else
            echo "::warning::$PACKAGE may be unnecessary — the install still succeeds without it"
          fi
