# commit 時にシェルスクリプトを整形・検査し、秘密が入っていないか見る。
# shfmt / shellcheck は script/setup が、gitleaks は mise が入れる。未インストールなら黙って飛ばす。
# このレポは public なので、gitleaks だけは飛ばしたときに警告を出す。
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: |
        command -v gitleaks >/dev/null || { echo "gitleaks が無いので秘密の検査を飛ばした" >&2; exit 0; }
        gitleaks git --staged --redact --no-banner
    shfmt:
      glob: "script/*"
      # launchd の plist はシェルスクリプトではない
      exclude: "*.plist"
      run: |
        command -v shfmt >/dev/null || exit 0
        shfmt -i 4 -ci -w {staged_files}
        git add {staged_files}
    shellcheck:
      glob: "script/*"
      # launchd の plist はシェルスクリプトではない
      exclude: "*.plist"
      # -x で source 先も追跡する(SC1091 回避)
      run: |
        command -v shellcheck >/dev/null || exit 0
        shellcheck -x -S warning {staged_files}
    zsh-syntax:
      glob: "*.zsh"
      run: |
        command -v zsh >/dev/null || exit 0
        for f in {staged_files}; do zsh -n "$f" || exit 1; done
    setup-behaviour:
      glob: "script/{setup,zed-strip-local}"
      # 構文ではなく挙動を見る。順序と失敗の伝わり方はリンタに見えない
      run: ./script/test
