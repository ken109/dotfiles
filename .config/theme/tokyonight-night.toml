# tokyonight (night) — このリポジトリ全体の配色の単一ソース。
# 各ツールの設定はこの値を手で反映している。将来 nawa のテンプレートで生成する。
# 出典: folke/tokyonight.nvim の night variant

[ui]
bg           = "#1a1b26"
bg_dark      = "#16161e"
bg_highlight = "#292e42"
fg           = "#c0caf5"
fg_dark      = "#a9b1d6"
fg_gutter    = "#3b4261"
comment      = "#565f89"
selection    = "#283457"
cursor       = "#c0caf5"

[normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[accent]
# 旧テーマのマゼンタ系アクセント (#f32882) の後継
primary = "#bb9af7"
orange  = "#ff9e64"
purple  = "#9d7cd8"
teal    = "#1abc9c"
