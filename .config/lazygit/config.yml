git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never

gui:
  sidePanelWidth: 0.20
  # tokyonight (night) — 単一ソース: theme.toml (sennit render が生成する)
  # 選択行は既存の方針どおり背景塗りではなく underline のままにしている。
  theme:
    activeBorderColor:
      - "#bb9af7"
      - bold
    inactiveBorderColor:
      - "#565f89"
    searchingActiveBorderColor:
      - "#e0af68"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - underline
    cherryPickedCommitFgColor:
      - "#bb9af7"
    cherryPickedCommitBgColor:
      - "#283457"
    unstagedChangesColor:
      - "#f7768e"
    defaultFgColor:
      - "#c0caf5"

refresher:
  refreshInterval: 3

os:
  editPreset: "nvim-remote"
