[window]
padding = { x = 10, y = 10 }
decorations = "None"
opacity = 0.85
blur = true
startup_mode = "Maximized"
level = "AlwaysOnTop"
option_as_alt = "Both"

[font]
size = 10
normal = { family = "Hack Nerd Font Mono" }

# tokyonight (night) — .config/theme/tokyonight-night.toml が単一ソース
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
cursor = "#c0caf5"
text   = "#1a1b26"

[colors.selection]
background = "#283457"
text       = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"
