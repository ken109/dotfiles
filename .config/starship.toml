"$schema" = 'https://starship.rs/config-schema.json'

# tokyonight (night) — theme.toml が単一ソース。sennit render が生成する。
# 標準の色名を上書きしているので、各モジュールの style 指定はそのまま使える。
palette = 'tokyonight'

[palettes.tokyonight]
black   = '#15161e'
red     = '#f7768e'
green   = '#9ece6a'
yellow  = '#e0af68'
blue    = '#7aa2f7'
magenta = '#bb9af7'
purple  = '#bb9af7'
cyan    = '#7dcfff'
white   = '#c0caf5'
orange  = '#ff9e64'
comment = '#565f89'

format = """
[┌$time─────────────────────────────────────────────────](bold white)
[│](bold white) $directory$all
[│](bold white)
[└](bold white)$character"""

[character]
success_symbol = '[>](green)'
error_symbol = '[>](red)'

[directory]
truncation_length = 0

[docker_context]
format = 'docker:[$context]($style) '
detect_folders = ['docker']

[git_branch]
always_show_remote = false
format = 'on [$symbol($remote_name/$remote_branch:)$branch]($style) '
symbol = ""

[git_commit]
commit_hash_length = 7
format = '[\(($tag [|](white) )$hash\)]($style) '
tag_disabled = false
tag_symbol = ''

[git_metrics]
disabled = false

[git_status]
conflicted = '[=${count}](red)'
ahead = '[⇡${count}](green)'
behind = '[⇣${count}](green)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](green)'
up_to_date = ''
untracked = '[?\($count\)](red)'
stashed = '[\$\($count\)](yellow)'
modified = '[!\($count\)](red)'
staged = '[+\($count\)](green)'
renamed = '[»\($count\)](yellow)'
deleted = '[✘\($count\)](red)'
style = 'bold white'

[golang]
format = 'go:[$version]($style) '
symbol = ''

[gcloud]
disabled = true

[nodejs]
format = 'node:[$version]($style) '
symbol = ''

[line_break]
disabled = true

[nix_shell]
format = 'nix-shell:[$state( \($name\))]($style) '

[python]
format = 'python:[$version]($style) '
symbol = ''

[rust]
format = 'rust:[$version]($style) '
symbol = ''

[time]
disabled = false
format = '[┤ $time ├]($style)'
time_format = '%T'
utc_time_offset = '+9'
style = 'bold white'
