"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌$time─────────────────────────────────────────────────](bold white)
[│](bold white) $directory$all
[│](bold white)
[└](bold white)$character"""

[buf]
format = 'buf:[$version]($style) '
symbol = ''

[bun]
format = 'bun:[$version]($style) '
symbol = ''

[c]
format = 'c:[$version(-$name)]($style) '
symbol = ''

[character]
success_symbol = '[>](green)'
error_symbol = '[>](red)'

[dart]
format = 'dart:[$version]($style) '
symbol = ''

[deno]
format = 'deno:[$version]($style) '
symbol = ''

[directory]
truncation_length = 0

[docker_context]
format = 'docker:[$context]($style) '
detect_folders = ['docker']

[elixir]
format = 'elixir:[$version \(OTP $otp_version\)]($style) '
symbol = ''

[gcloud]
disabled = true

[git_branch]
always_show_remote = false
format = 'on [$symbol($remote_name/$remote_branch:)$branch]($style) '
symbol = ""

[git_commit]
commit_hash_length = 7
format = '[\(($tag [|](white) )$hash\)]($style) '
tag_disabled = false
tag_symbol = ''

[git_metrics]
disabled = false

[git_status]
conflicted = '[=${count}](red)'
ahead = '[⇡${count}](green)'
behind = '[⇣${count}](green)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](green)'
up_to_date = ''
untracked = '[?\($count\)](red)'
stashed = '[\$\($count\)](yellow)'
modified = '[!\($count\)](red)'
staged = '[+\($count\)](green)'
renamed = '[»\($count\)](yellow)'
deleted = '[✘\($count\)](red)'
style = 'bold white'

[golang]
format = 'go:[$version]($style) '
symbol = ''

[java]
format = 'java:[$version]($style) '
symbol = ''

[kotlin]
format = 'kotlin:[$version]($style) '
symbol = ''

[line_break]
disabled = true

[lua]
format = 'lua:[$version]($style) '
symbol = ''

[nix_shell]
format = 'nix-shell:[$state( \($name\))]($style) '

[nodejs]
format = 'node:[$version]($style) '
symbol = ''

[php]
format = 'php:[$version]($style) '
symbol = ''

[python]
format = 'python:[$version]($style) '
symbol = ''

[ruby]
format = 'ruby:[$version]($style) '
symbol = ''

[rust]
format = 'rust:[$version]($style) '
symbol = ''

[swift]
format = 'swift:[$version]($style) '
symbol = ''

[time]
disabled = false
format = '[┤ $time ├]($style)'
time_format = '%T'
utc_time_offset = '+9'
style = 'bold white'

[zig]
format = 'zig:[$version]($style) '
symbol = ''
